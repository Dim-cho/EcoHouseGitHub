<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360" role="img" aria-label="Modern flat LED television on a slim stand, showing a sunny landscape" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .tv-float{animation:tv-float 5s ease-in-out infinite}
  .tv-glow{animation:tv-glow 2.6s ease-in-out infinite}
  .tv-static{animation:tv-static .35s steps(2) infinite}
  .tv-heat{animation:tv-heat 2.4s ease-in-out infinite}
  .tv-rise{animation:tv-rise 3.6s ease-out infinite}
  .tv-twinkle{animation:tv-twinkle 2.2s ease-in-out infinite}
  .tv-spin{animation:tv-spin 4s linear infinite}
  @keyframes tv-float{50%{transform:translateY(-10px)}}
  @keyframes tv-glow{50%{opacity:.45}}
  @keyframes tv-static{50%{transform:translate(3px,2px)}}
  @keyframes tv-heat{50%{transform:translateY(-6px);opacity:.35}}
  @keyframes tv-rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
  @keyframes tv-twinkle{50%{opacity:.25}}
  @keyframes tv-spin{to{rotate:360deg}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

  <ellipse cx="200" cy="330" rx="110" ry="7" fill="#000" opacity=".12"/>
  <rect x="190" y="262" width="20" height="50" fill="#2b323a"/>
  <rect x="128" y="308" width="144" height="12" rx="6" fill="#222a31"/>
  <rect x="38" y="70" width="324" height="198" rx="10" fill="#1b2127"/>
  <clipPath id="led-clip"><rect x="46" y="78" width="308" height="178" rx="4"/></clipPath>
  <g clip-path="url(#led-clip)"><g transform="translate(46 78) scale(1.0266666666666666 0.9888888888888889)"><defs><linearGradient id="led-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4f2"/><stop offset="1" stop-color="#cdeafc"/></linearGradient></defs>
    <rect width="300" height="180" fill="url(#led-sky)"/><circle cx="228" cy="46" r="34" fill="#ffd34d" opacity=".25"/><circle cx="228" cy="46" r="22" fill="#ffd34d"/><path d="M0 120 C50 96 90 100 140 112 C190 124 240 92 300 104 L300 180 L0 180 Z" fill="#7cc77f"/><path d="M0 150 C60 128 110 132 160 142 C210 152 250 136 300 140 L300 180 L0 180 Z" fill="#4fa35a"/><g><rect x="128" y="112" width="44" height="30" fill="#ffffff"/>
      <path d="M122 114 L150 92 L178 114 Z" fill="#e0584f"/>
      <rect x="136" y="120" width="10" height="10" fill="#ffd34d"/><rect x="154" y="122" width="10" height="20" fill="#3b3a36"/></g><g fill="#ffffff" opacity=".95"><rect x="40" y="40" width="54" height="14" rx="7"/><rect x="54" y="30" width="26" height="18" rx="9"/></g></g>
    <path d="M46 78 L170 78 L80 256 L46 256 Z" fill="#fff" opacity=".07"/>
  </g>
  <rect x="38" y="262" width="324" height="6" rx="3" fill="#252c33"/>
  <circle cx="200" cy="264" r="2" fill="#4ade80"/>

</svg>
